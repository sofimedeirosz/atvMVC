<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários</title>
</head>
<body>
    <header>
        <h1>Usuários</h1>
        <nav aria-label="Navegação">
            <ul>
                <li><a th:href="@{/livros/inicio}">Início</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section aria-labelledby="cadastro">
            <h2 id="cadastro">Cadastro</h2>
            <form th:action="@{/usuarios/cadastrar}" method="post">
                <fieldset>
                    <legend>Dados do usuário</legend>
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </p>
                    <p>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" required>
                    </p>
                    <p>
                        <label for="usuario">Usuário:</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </p>
                    <p>
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required>
                    </p>
                </fieldset>
                <p>
                    <button type="submit">Cadastrar</button>
                </p>
            </form>
        </section>
        <section aria-labelledby="registros">
            <h2 id="registros">Registros</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Índice</th>
                        <th scope="col">Nome</th>
                        <th scope="col">CPF</th>
                        <th scope="col">Usuário</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario, item : ${usuarios}">
                        <td th:text="${item.index}"></td>
                        <td th:text="${usuario.nome}"></td>
                        <td th:text="${usuario.cpf}"></td>
                        <td th:text="${usuario.usuario}"></td>
                        <td>
                            <a th:href="@{/usuarios/editar/{indice}(indice=${item.index})}">Editar</a>
                            <form th:action="@{/usuarios/excluir/{indice}(indice=${item.index})}" method="post">
                                <input type="hidden" name="_method" value="DELETE">
                                <button type="submit">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(usuarios)}">Nenhum registro cadastrado.</p>
        </section>
    </main>
</body>
</html>
