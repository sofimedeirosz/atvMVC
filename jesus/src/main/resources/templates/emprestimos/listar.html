<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empréstimos</title>
</head>
<body>
<h1>Empréstimos</h1>
<p><a th:href="@{/livros/inicio}">Início</a></p>
<table border="1">
    <thead>
    <tr>
        <th>Índice</th>
        <th>Status</th>
        <th>Data</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emprestimo, item : ${emprestimos}">
        <td th:text="${item.index}"></td>
        <td th:text="${emprestimo.statusEmprestimo}"></td>
        <td th:text="${emprestimo.dataEmprestimo}"></td>
    </tr>
    </tbody>
</table>
<p th:if="${#lists.isEmpty(emprestimos)}">Nenhum registro cadastrado.</p>
</body>
</html>
