<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>
<h1>Livros</h1>
<p><a th:href="@{/livros/inicio}">Início</a></p>
<table border="1">
    <thead>
    <tr>
        <th>Índice</th>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro, item : ${livros}">
        <td th:text="${item.index}"></td>
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.isbn}"></td>
    </tr>
    </tbody>
</table>
<p th:if="${#lists.isEmpty(livros)}">Nenhum registro cadastrado.</p>
</body>
</html>
