<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar autor</title>
</head>
<body>
    <header>
        <h1>Editar autor</h1>
        <nav aria-label="Navegação">
            <ul>
                <li><a th:href="@{/livros/inicio}">Início</a></li>
                <li><a th:href="@{/autores}">Voltar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form th:action="@{/autores/editar/{indice}(indice=${indice})}" method="post">
            <fieldset>
                <legend>Dados do autor</legend>
                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" th:value="${autor.nome}" required>
                </p>
                <p>
                    <label for="nacionalidade">Nacionalidade:</label>
                    <input type="text" id="nacionalidade" name="nacionalidade" th:value="${autor.nacionalidade}" required>
                </p>
                <p>
                    <label for="obrasPublicadas">Obras publicadas:</label>
                    <input type="number" id="obrasPublicadas" name="obrasPublicadas" th:value="${autor.obrasPublicadas}" required>
                </p>
            </fieldset>
            <p>
                <button type="submit">Salvar</button>
            </p>
        </form>
    </main>
</body>
</html>
