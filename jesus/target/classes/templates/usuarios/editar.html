<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar usuário</title>
</head>
<body>
    <header>
        <h1>Editar usuário</h1>
        <nav aria-label="Navegação">
            <ul>
                <li><a th:href="@{/livros/inicio}">Início</a></li>
                <li><a th:href="@{/usuarios}">Voltar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form th:action="@{/usuarios/editar/{indice}(indice=${indice})}" method="post">
            <fieldset>
                <legend>Dados do usuário</legend>
                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" th:value="${usuario.nome}" required>
                </p>
                <p>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" th:value="${usuario.cpf}" required>
                </p>
                <p>
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" th:value="${usuario.usuario}" required>
                </p>
                <p>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" th:value="${usuario.senha}" required>
                </p>
            </fieldset>
            <p>
                <button type="submit">Salvar</button>
            </p>
        </form>
    </main>
</body>
</html>
