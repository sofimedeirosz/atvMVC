<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar categoria</title>
</head>
<body>
    <header>
        <h1>Editar categoria</h1>
        <nav aria-label="Navegação">
            <ul>
                <li><a th:href="@{/livros/inicio}">Início</a></li>
                <li><a th:href="@{/categorias}">Voltar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form th:action="@{/categorias/editar/{indice}(indice=${indice})}" method="post">
            <fieldset>
                <legend>Dados da categoria</legend>
                <p>
                    <label for="genero">Gênero:</label>
                    <input type="text" id="genero" name="genero" th:value="${categoria.genero}" required>
                </p>
            </fieldset>
            <p>
                <button type="submit">Salvar</button>
            </p>
        </form>
    </main>
</body>
</html>
